name: Live check

# Once a week, check the tool against the real Thru network: fund the check's
# THRUSD token account with 1 test THRUSD from the dev.thru.org faucet, export
# the wallet, and make sure the deposit shows up, readable and reconciled.
# A failure emails the repository owner. See scripts/live-check.mjs.
#
# One-time setup: Settings → Secrets and variables → Actions → New repository
# secret, named THRU_DEVELOPERS_API_KEY, holding a key from dev.thru.org → Account.
# Without it the check still runs, on the existing history only.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: node scripts/live-check.mjs
        env:
          THRU_DEVELOPERS_API_KEY: ${{ secrets.THRU_DEVELOPERS_API_KEY }}
